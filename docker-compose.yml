services:

  # ── Qwen GGUF model via llama.cpp ─────────────────────────────────────────
  llm:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: okc_llm
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    command: >
      -m /models/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      -c 4096
      -np 1
      --log-disable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    # For NVIDIA GPU, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── FastAPI backend + static frontend ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: okc_backend
    ports:
      - "3000:3000"
    environment:
      - LLM_URL=http://llm:8080
      - LLM_MAX_TOKENS=512
      - LLM_TEMPERATURE=0.7
      - LLM_TIMEOUT=120
    volumes:
      # Mount knowledge base so rebuild doesn't require image rebuild
      - ./knowledge:/app/knowledge:ro
    depends_on:
      llm:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: okc_net
